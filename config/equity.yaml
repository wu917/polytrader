# 股票/商品日级涨跌盘定时交易配置（run_equity_scheduler.py 专用）
#
# 调度器常驻，按美东时间每日固定时刻自动触发一轮扫描+评估+下单；
# 下单结果存 pending_trades（window='daily' + account），settle_worker 结算。

schedule:
  timezone: America/New_York
  # 美东每日触发时刻（可多个，如开盘后/午间/收盘前）
  runs: ["09:30", "12:00", "14:30"]

# 标的白名单（slug 前缀小写，对应 SYMBOL_MAP 17 个）：
#   股票: nvda tsla msft aapl amzn googl meta coin pltr
#   指数: spy qqq ndx
#   商品/海外代理: xauusd xagusd wti hsi ukx
# 空列表 = 全部
# 2026-08-19 实盘切换：只跑 spy（spy_reversal 策略目标盘）
symbols: ["spy"]

# 账户（config/accounts.yaml 中账户名；入 pending_trades.account 区分统计）
account: default

# 策略：equity=LLM 评估（默认）| spy_reversal=SPY 大跌次日反转 skill
#   spy_reversal 条件（720 天回测：昨跌幅 -0.8%~-1.5% → 次日涨率 66.7%）：
#   无需 LLM，仅对 spy-up-or-down 盘出 YES 信号
# 2026-08-19 实盘切换：spy_reversal（用户授权，$1/笔，仅 spy 盘）
strategy: spy_reversal

# live=false 模拟成交（simulate_equity_updown），true 真实 FOK 下单（需授权）
# 2026-08-19 用户授权实盘
live: true

# 单笔金额 / LLM 信号门槛 / 流动性门槛 / 每轮最多几笔
size: 1.0
min_edge: 0.05
min_liquidity: 200.0
per_run: 3
max_markets: 10
